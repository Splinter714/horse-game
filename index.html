<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Horse Care</title>
    <!-- iOS home-screen support (#37) — VitePWA's own manifest/registerSW injection
         covers the web-standard PWA bits at build time, but Safari on iOS still
         needs its own apple- prefixed tags to give a standalone, icon'd launch when
         added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horse Care" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1c2330;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
